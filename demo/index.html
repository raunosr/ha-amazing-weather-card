<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Amazing Weather Card · local demo</title>
    <link rel="icon" href="../assets/icon.png" />
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        background: #0b1422;
        color: #e9f3fa;
        font:
          14px/1.5 system-ui,
          sans-serif;
        --primary-text-color: #e9f3fa;
        --secondary-text-color: #b1c3d7;
        --card-background-color: #111e30;
        --ha-card-background: #111e30;
        --divider-color: #2c4057;
      }
      header {
        max-width: 736px;
        margin: 0 auto 20px;
        display: flex;
        gap: 14px;
        align-items: center;
      }
      header img {
        width: 50px;
        height: 50px;
        border-radius: 12px;
      }
      h1 {
        font-size: 20px;
        line-height: 1.3;
        margin: 0;
        font-weight: 500;
      }
      header p {
        margin: 4px 0 0;
        color: #b1c3d7;
        font-size: 12px;
      }
      .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        max-width: 736px;
        margin: 0 auto 18px;
      }
      label {
        display: grid;
        gap: 4px;
        font-size: 12px;
      }
      select,
      button {
        font: inherit;
        background: #1d3047;
        color: #e9f3fa;
        border: 1px solid #426079;
        border-radius: 7px;
        min-height: 38px;
        padding: 6px 9px;
      }
      #card {
        max-width: 736px;
        margin: auto;
      }
      #editor {
        max-width: 736px;
        margin: 20px auto;
        display: none;
        background: #111e30;
        padding: 20px;
        border: 1px solid #426079;
        border-radius: 14px;
      }
      #editor.open {
        display: block;
      }
      .demo-note {
        max-width: 736px;
        margin: 16px auto;
        color: #b1c3d7;
        font-size: 12px;
      }
      @media (max-width: 480px) {
        body {
          padding: 12px;
        }
        .controls {
          gap: 8px;
        }
        header {
          margin-bottom: 16px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <img src="../assets/icon.png" alt="Amazing Weather Card icon" />
      <div>
        <h1>Amazing Weather Card</h1>
        <p>Local development demo · all readings are examples</p>
      </div>
    </header>
    <div class="controls">
      <label
        >Scenario<select id="scenario">
          <option value="normal">All data</option>
          <option value="missing-rain">Missing rain sensor</option>
          <option value="offline">Station unavailable</option>
          <option value="seven-days">Seven-day forecast</option>
          <option value="daily-only">Daily forecast only</option>
          <option value="zero">Zero readings</option>
          <option value="imperial">Fahrenheit station</option>
          <option value="history-error">History unavailable</option>
          <option value="forecast-error">Forecast unavailable</option>
        </select></label
      ><label
        >Theme<select id="theme">
          <option value="dark">Dark</option>
          <option value="light">Light</option>
          <option value="auto">HA theme</option>
        </select></label
      ><label
        >Language<select id="language">
          <option value="fi">Suomi</option>
          <option value="en">English</option>
        </select></label
      ><label
        >Display<select id="display">
          <option value="personal">Personal</option>
          <option value="wall">Wall display · 60s return</option>
        </select></label
      ><button id="edit" type="button">Card editor</button>
    </div>
    <main id="card"></main>
    <div id="editor"></div>
    <p class="demo-note">
      The card uses the same Home Assistant interfaces in this demo and in a
      dashboard. This demo supplies simulated entities, forecast subscriptions
      and recorder responses. No connection to a real Home Assistant instance is
      made.
    </p>
    <script type="module" src="../.cache/index.js"></script>
    <script type="module" src="../.cache/demo.js"></script>
  </body>
</html>
